<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adnaan Shah</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        
        .offline-screen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        h1 { font-size: 2.2rem; font-weight: 500; letter-spacing: -0.5px; margin-bottom: 8px; color: #fff; }
        p { color: #888; font-size: 0.95rem; font-weight: 400; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .status-dot { width: 8px; height: 8px; background: #ff4444; border-radius: 50%; display: inline-block; }
        
        #frameContainer { width: 100%; height: 100%; display: block; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div id="frameContainer"></div>

    <div class="offline-screen" id="offlineScreen">
        <h1>Adnaan Shah</h1>
        <p><span class="status-dot"></span>Server Offline — Mobile Node Disconnected</p>
    </div>

    <script>
        const subPath = window.location.pathname;
        const targetUrl = "https://variables-heard-delayed-uncertainty.trycloudflare.com" + subPath + window.location.search;
        const offlineScreen = document.getElementById('offlineScreen');
        const frameContainer = document.getElementById('frameContainer');

        let loaded = false;

        const frame = document.createElement('iframe');
        frame.src = targetUrl;
        
        frame.onload = function() {
            loaded = true;
        };

        frameContainer.appendChild(frame);

        setTimeout(() => {
            if (!loaded) {
                frameContainer.style.display = 'none';
                offlineScreen.style.display = 'flex';
            }
        }, 4000);
    </script>
</body>
</html>
