<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADNAAN SHAH // Neural Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #010102; color: #fff; }
        #frameContainer, iframe { width: 100%; height: 100%; border: none; }
        #fallback-portfolio { display: none; width: 100%; height: 100%; overflow: auto; }
    </style>
</head>
<body>
    <div id="frameContainer"></div>

    <div id="fallback-portfolio">
        <!-- OFFLINE PORTFOLIO EMBEDDED AUTOMATICALLY -->
        
    </div>

    <script>
        const subPath = window.location.pathname;
        const targetUrl = "https://dragon-sri-bosnia-eye.trycloudflare.com" + subPath + window.location.search;
        const frameContainer = document.getElementById('frameContainer');
        const fallback = document.getElementById('fallback-portfolio');

        let loaded = false;
        const frame = document.createElement('iframe');
        frame.src = targetUrl;
        
        frame.onload = function() { loaded = true; };
        frameContainer.appendChild(frame);

        setTimeout(() => {
            if (!loaded) {
                frameContainer.style.display = 'none';
                fallback.style.display = 'block';
            }
        }, 3500);
    </script>
</body>
</html>
